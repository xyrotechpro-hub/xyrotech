name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows app
        run: go build -tags "desktop,production" -trimpath -ldflags "-H=windowsgui -s -w" -o FacePointer-Updated.exe .

      - name: Save executable
        uses: actions/upload-artifact@v7
        with:
          name: FacePointer-Windows
          path: FacePointer-Updated.exe
          if-no-files-found: error
          retention-days: 7
